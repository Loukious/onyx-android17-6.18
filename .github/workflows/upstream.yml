name: Track Android 17 6.18 LTS and KernelSU Next dev

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: upstream-tracker
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  KONOHA_SOURCE_ROOT: ${{ github.workspace }}/source

jobs:
  track:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout CI automation
        uses: actions/checkout@v4
      - name: Checkout accepted source
        uses: actions/checkout@v4
        with:
          ref: android17-6.18-lts
          path: source
      - name: Detect upstream, source and KernelSU Next changes
        id: detect
        run: python3 ci/track_upstream.py
      - name: Prepare runner for a kernel update
        if: steps.detect.outputs.kernel_changed == 'true'
        run: bash ci/bootstrap_runner.sh
      - name: Fetch detected LTS revision
        if: steps.detect.outputs.kernel_changed == 'true'
        env:
          REVISION: ${{ steps.detect.outputs.latest }}
        run: |
          git init "$RUNNER_TEMP/upstream-common"
          git -C "$RUNNER_TEMP/upstream-common" remote add origin https://android.googlesource.com/kernel/common
          git -C "$RUNNER_TEMP/upstream-common" fetch --depth 1 origin "$REVISION"
          git -C "$RUNNER_TEMP/upstream-common" checkout --detach FETCH_HEAD
          python3 ci/track_upstream.py --update "$RUNNER_TEMP/upstream-common" --revision "$REVISION"
          python3 ci/refresh_recipe.py "$RUNNER_TEMP/upstream-common"
          rm -rf "$RUNNER_TEMP/upstream-common"
      - name: Replay the port and materialize the complete updated source
        if: steps.detect.outputs.kernel_changed == 'true'
        run: |
          python3 source/port/prepare.py "$RUNNER_TEMP/konoha-workspace" --jobs 4
          python3 source/port/stage.py "$RUNNER_TEMP/konoha-workspace"
          python3 ci/snapshot.py "$RUNNER_TEMP/konoha-workspace/onyx" --write
          python3 ci/snapshot_common.py "$RUNNER_TEMP/konoha-workspace" --write
      - name: Publish source update PR and trigger its complete build on the CI branch
        if: steps.detect.outputs.kernel_changed == 'true'
        env:
          REVISION: ${{ steps.detect.outputs.latest }}
          KERNELSU_REVISION: ${{ steps.detect.outputs.kernelsu }}
        run: python3 ci/publish_update.py "$REVISION" --kernelsu "$KERNELSU_REVISION"
      - name: Rebuild accepted source when its source or KernelSU Next dev changes
        if: steps.detect.outputs.kernel_changed != 'true' && (steps.detect.outputs.kernelsu_changed == 'true' || steps.detect.outputs.source_changed == 'true' || steps.detect.outputs.release_needed == 'true')
        env:
          SOURCE_REVISION: ${{ steps.detect.outputs.source_revision }}
          KERNELSU_REVISION: ${{ steps.detect.outputs.kernelsu }}
        run: python3 ci/dispatch_build.py "$SOURCE_REVISION" "$KERNELSU_REVISION"
